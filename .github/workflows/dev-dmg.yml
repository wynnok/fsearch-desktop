name: Development DMG

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-dmg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify development DMG
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FSEARCH_DEV_RUST_VERSION: "1.99.0"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Xcode 26.6
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Cache project-local build state
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .build/cargo-home
            .build/rustup-home
            .build/swiftpm-cache
          key: dev-dmg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock', 'scripts/architecture.sh', 'Package.swift') }}
          restore-keys: |
            dev-dmg-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare pinned project-local Rust toolchain
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$PWD/.build/rustup-home"
          mkdir -p "$RUSTUP_HOME"
          rustup toolchain install "$FSEARCH_DEV_RUST_VERSION" \
            --profile minimal --no-self-update \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          printf '%s\n' "$FSEARCH_DEV_RUST_VERSION" > "$RUSTUP_HOME/toolchain-version"
          ACTUAL="$(RUSTUP_TOOLCHAIN="$FSEARCH_DEV_RUST_VERSION" rustc -V | awk '{print $2}')"
          [[ "$ACTUAL" == "$FSEARCH_DEV_RUST_VERSION" ]]

      - name: Verify approved upstream pin
        run: bash scripts/check-upstream-pin.sh

      - name: Check
        run: bash scripts/dev.sh check

      - name: Test
        run: bash scripts/dev.sh test

      - name: Package development DMG
        run: bash scripts/package-dev-dmg.sh

      - name: Verify package and installed application
        run: bash scripts/verify-dev-dmg.sh .build/dev-dmg/output/*.dmg

      - name: Upload successful development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fsearch-development-dmg-${{ github.sha }}
          path: |
            .build/dev-dmg/output/*.dmg
            .build/dev-dmg/output/SHA256SUMS
            .build/dev-dmg/output/build-manifest.txt
            .build/dev-dmg/output/THIRD-PARTY-NOTICES.txt
            .build/dev-dmg/verification/verification-report.txt
            .build/dev-dmg/verification/smoke.log
            .build/dev-dmg/verification/journeys/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
