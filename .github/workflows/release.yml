name: Approved release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    if: ${{ !endsWith(github.ref_name, '-unsigned') }}
    runs-on: macos-14
    environment: release
    timeout-minutes: 120
    env:
      FSEARCH_DEV_RUST_VERSION: "1.99.0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode 16+
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          [[ -n "$XCODE_APP" ]] || { echo "Xcode 16+ is required for Swift 6" >&2; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Verify maintainer acceptance bound to tag and commit
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.RELEASE_APPROVAL_JSON }}
        run: |
          set -euo pipefail
          mkdir -p .build/release-output
          printf '%s' "$RELEASE_APPROVAL_JSON" > .build/release-output/approval.json
          bash scripts/release-preflight.sh "$RELEASE_TAG" .build/release-output/approval.json
          test -s "docs/releases/$RELEASE_TAG.md"
          printf 'FSEARCH_DEV_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Prepare project-local Rust toolchain
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$PWD/.build/rustup-home"
          mkdir -p "$RUSTUP_HOME"
          rustup toolchain install "$FSEARCH_DEV_RUST_VERSION" --profile minimal --no-self-update --target aarch64-apple-darwin,x86_64-apple-darwin
          printf '%s\n' "$FSEARCH_DEV_RUST_VERSION" > "$RUSTUP_HOME/toolchain-version"
      - name: Check, test, build and verify development input
        run: |
          set -euo pipefail
          bash scripts/check-upstream-pin.sh
          bash scripts/dev.sh check
          bash scripts/dev.sh test
          bash scripts/package-dev-dmg.sh
          bash scripts/verify-dev-dmg.sh --dmg .build/dev-dmg/output/*.dmg
      - name: Real signing, notarization and installed final validation
        env:
          FSEARCH_CERTIFICATE_BASE64: ${{ secrets.FSEARCH_CERTIFICATE_BASE64 }}
          FSEARCH_CERTIFICATE_PASSWORD: ${{ secrets.FSEARCH_CERTIFICATE_PASSWORD }}
          FSEARCH_NOTARY_KEY_BASE64: ${{ secrets.FSEARCH_NOTARY_KEY_BASE64 }}
          FSEARCH_NOTARY_KEY_ID: ${{ secrets.FSEARCH_NOTARY_KEY_ID }}
          FSEARCH_NOTARY_ISSUER: ${{ secrets.FSEARCH_NOTARY_ISSUER }}
          FSEARCH_SIGNING_IDENTITY: ${{ vars.FSEARCH_SIGNING_IDENTITY }}
        run: bash scripts/sign-release-ci.sh '.build/dev-dmg/package/Fsearch Desktop Development.app' "$FSEARCH_DEV_VERSION"
      - name: Prepare release notes and build records
        run: |
          set -euo pipefail
          cp "docs/releases/$RELEASE_TAG.md" .build/release-output/release-notes.md
          cp .build/dev-dmg/output/build-manifest.txt .build/release-output/source-build-manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: .build/release-output/
          if-no-files-found: error
      - name: Preserve safe failure summaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-failure-summaries
          path: |
            .build/signing/run.*/validation-status.txt
            .build/signing/run.*/*-notarization.json
          if-no-files-found: ignore

  publish:
    needs: build-sign
    if: ${{ !endsWith(github.ref_name, '-unsigned') }}
    runs-on: macos-14
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: .build/release-output
      - name: Verify transferred assets and approval again
        run: |
          set -euo pipefail
          bash scripts/release-preflight.sh "$RELEASE_TAG" .build/release-output/approval.json
          cd .build/release-output
          shasum -a 256 --check SHA256SUMS
          test -s validation-report.txt
          jq -e '.status == "Accepted"' app-notarization.json
          jq -e '.status == "Accepted"' dmg-notarization.json
          test -s THIRD-PARTY-NOTICES.txt
          test -s release-notes.md
      - name: Create a new draft without creating or rewriting tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file .build/release-output/release-notes.md \
            .build/release-output/*.dmg .build/release-output/SHA256SUMS \
            .build/release-output/validation-report.txt .build/release-output/approval.json \
            .build/release-output/*-notarization.json .build/release-output/THIRD-PARTY-NOTICES.txt \
            .build/release-output/source-build-manifest.txt
      - name: Download draft assets, install and verify before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .build/release-download
          bash scripts/verify-signed-release.sh .build/release-download/*.dmg "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-download-install-evidence
          path: .build/release-verification/report.txt
          if-no-files-found: error
      - name: Publish only the newly created and verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
