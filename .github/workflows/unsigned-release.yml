name: Unsigned pre-release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*-unsigned*"

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, verify and publish unsigned pre-release
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FSEARCH_DEV_RUST_VERSION: "1.99.0"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Xcode 26.6
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Prepare pinned project-local Rust toolchain
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$PWD/.build/rustup-home"
          mkdir -p "$RUSTUP_HOME"
          rustup toolchain install "$FSEARCH_DEV_RUST_VERSION" \
            --profile minimal --no-self-update \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          printf '%s\n' "$FSEARCH_DEV_RUST_VERSION" > "$RUSTUP_HOME/toolchain-version"
          ACTUAL="$(RUSTUP_TOOLCHAIN="$FSEARCH_DEV_RUST_VERSION" rustc -V | awk '{print $2}')"
          [[ "$ACTUAL" == "$FSEARCH_DEV_RUST_VERSION" ]]

      - name: Verify approved upstream pin
        run: bash scripts/check-upstream-pin.sh

      - name: Derive application version from tag
        run: |
          set -euo pipefail
          version="$(bash scripts/unsigned-release-version.sh "$RELEASE_TAG")"
          printf 'FSEARCH_DEV_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Check
        run: bash scripts/dev.sh check

      - name: Test
        run: bash scripts/dev.sh test

      - name: Package development DMG
        run: bash scripts/package-dev-dmg.sh

      - name: Verify package and installed application
        run: bash scripts/verify-dev-dmg.sh --dmg .build/dev-dmg/output/*.dmg

      - name: Package architecture-specific DMGs
        run: |
          bash scripts/package-arch-dmg.sh arm64
          bash scripts/package-arch-dmg.sh x86_64

      - name: Verify unsigned release notes
        run: |
          set -euo pipefail
          version="$(bash scripts/unsigned-release-version.sh "$RELEASE_TAG")"
          test -s "docs/releases/$RELEASE_TAG.md"
          grep -Fq "应用内版本为 \`$version\`" "docs/releases/$RELEASE_TAG.md"

      - name: Publish unsigned GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            .build/dev-dmg/output/*.dmg \
            .build/dev-dmg/output/SHA256SUMS \
            .build/dev-dmg/output/build-manifest*.txt \
            .build/dev-dmg/output/THIRD-PARTY-NOTICES.txt \
            .build/dev-dmg/verification/verification-report*.txt
          )
          if existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"; then
            [[ "$existing" == true ]] || { echo 'Refusing to replace a stable release' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "$RELEASE_TAG (unsigned)" --notes-file "docs/releases/$RELEASE_TAG.md"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                case "$name" in
                  "Fsearch-Desktop-${FSEARCH_DEV_VERSION}-unsigned-"*.dmg)
                    if [[ ! -f ".build/dev-dmg/output/$name" ]]; then
                      gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
                    fi
                    ;;
                esac
              done
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "$RELEASE_TAG (unsigned)" --notes-file "docs/releases/$RELEASE_TAG.md" "${assets[@]}"
          fi
